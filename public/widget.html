<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ecommerce Chat Widget Demo</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background: #f4f4f6; margin: 0; }
  #chat { max-width: 420px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.1); overflow: hidden; }
  #header { background: #1a1a2e; color: #fff; padding: 16px; font-weight: 600; }
  #messages { height: 420px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 12px; border-radius: 10px; max-width: 80%; line-height: 1.4; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #1a1a2e; color: #fff; }
  .bot { align-self: flex-start; background: #eee; color: #111; }
  .escalated { border: 2px solid #e67e22; }
  #inputRow { display: flex; border-top: 1px solid #eee; }
  #input { flex: 1; border: none; padding: 12px; font-size: 14px; }
  #send { border: none; background: #1a1a2e; color: #fff; padding: 0 18px; cursor: pointer; }
</style>
</head>
<body>
  <div id="chat">
    <div id="header">Store Support</div>
    <div id="messages"></div>
    <div id="inputRow">
      <input id="input" placeholder="Ask about orders, shipping, returns..." />
      <button id="send">Send</button>
    </div>
  </div>

<script>
  const userId = 'demo-user-' + Math.random().toString(36).slice(2, 8);
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');

  function addMessage(text, role, escalated) {
    const div = document.createElement('div');
    div.className = 'msg ' + role + (escalated ? ' escalated' : '');
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function send() {
    const message = inputEl.value.trim();
    if (!message) return;
    addMessage(message, 'user');
    inputEl.value = '';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId, message }),
      });
      const data = await res.json();
      addMessage(data.reply, 'bot', data.escalated);
    } catch (e) {
      addMessage('Network error. Please try again.', 'bot');
    }
  }

  document.getElementById('send').addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

  addMessage('Hi! I\'m here to help with orders, shipping, returns, and product questions.', 'bot');
</script>
</body>
</html>
